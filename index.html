<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Aurora — iPhone Live Wallpaper</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #020412; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; object-fit: cover; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// ============================================================
// Aurora lock-screen wallpaper.
// Every time-dependent term is a sin/cos of 2*PI*k*t/LOOP with
// integer k, so the animation loops perfectly every LOOP seconds.
// ============================================================
const LOOP = 6;            // seconds per perfect loop
const RENDER_W = 1080;     // 19.5:9 — matches iPhone lock screen aspect
const RENDER_H = 2340;

const TAU = Math.PI * 2;

// Deterministic PRNG so offline-rendered frames match exactly.
function mulberry32(seed) {
  return function () {
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    let z = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    z = (z + Math.imul(z ^ (z >>> 7), 61 | z)) ^ z;
    return ((z ^ (z >>> 14)) >>> 0) / 4294967296;
  };
}

const canvas = document.getElementById('c');
canvas.width = RENDER_W;
canvas.height = RENDER_H;
const ctx = canvas.getContext('2d');

// Low-res offscreen buffer for the aurora glow; upscaling it gives
// a soft natural blur for free.
const GW = 270, GH = 585;
const glow = document.createElement('canvas');
glow.width = GW; glow.height = GH;
const gctx = glow.getContext('2d');

// ---------- static scene elements (seeded, computed once) ----------
const rand = mulberry32(1337);

const stars = [];
for (let i = 0; i < 170; i++) {
  stars.push({
    x: rand(),
    y: rand() * 0.62,
    r: 0.6 + rand() * 1.7,
    base: 0.25 + rand() * 0.55,
    k: 1 + Math.floor(rand() * 3),   // integer cycles per loop -> seamless twinkle
    phase: rand(),
  });
}

// Two mountain ridgelines along the bottom.
function makeRidge(seed, points, base, amp) {
  const r = mulberry32(seed);
  const ys = [];
  let y = base;
  for (let i = 0; i <= points; i++) {
    y += (r() - 0.5) * amp;
    y = Math.max(base - amp * 1.6, Math.min(base + amp * 1.6, y));
    ys.push(y);
  }
  return ys;
}
const ridgeFar = makeRidge(42, 24, 0.845, 0.028);
const ridgeNear = makeRidge(7, 16, 0.905, 0.034);

// Aurora ribbons: color, vertical anchor, curtain length, motion params.
// All wave speeds are integers (cycles per loop).
const ribbons = [
  { color: [64, 255, 190],  yc: 0.30, len: 0.34, amp: 0.055, fx: 1.6, sp: 1, fx2: 3.9, sp2: 2, alpha: 0.42 },
  { color: [120, 235, 255], yc: 0.40, len: 0.26, amp: 0.045, fx: 2.3, sp: -1, fx2: 5.1, sp2: 1, alpha: 0.30 },
  { color: [150, 110, 255], yc: 0.22, len: 0.30, amp: 0.065, fx: 1.2, sp: 1, fx2: 2.8, sp2: -2, alpha: 0.26 },
  { color: [70, 160, 255],  yc: 0.50, len: 0.20, amp: 0.035, fx: 3.1, sp: -2, fx2: 6.3, sp2: 1, alpha: 0.20 },
];

// ---------- drawing ----------
function drawSky() {
  const g = ctx.createLinearGradient(0, 0, 0, RENDER_H);
  g.addColorStop(0.00, '#01030e');
  g.addColorStop(0.45, '#060b26');
  g.addColorStop(0.80, '#12102f');
  g.addColorStop(1.00, '#1b1230');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, RENDER_W, RENDER_H);
}

function drawAurora(t) {
  const p = t / LOOP; // 0..1 loop phase
  gctx.clearRect(0, 0, GW, GH);
  gctx.globalCompositeOperation = 'lighter';

  const step = 2;
  for (const rb of ribbons) {
    const [cr, cg, cb] = rb.color;
    for (let x = 0; x < GW; x += step) {
      const u = x / GW;
      // ribbon centreline — sums of sines, integer speeds => perfect loop
      const yc = (rb.yc
        + rb.amp * Math.sin(TAU * (u * rb.fx + rb.sp * p))
        + rb.amp * 0.45 * Math.sin(TAU * (u * rb.fx2 + rb.sp2 * p))) * GH;
      // curtain shimmer: brightness ripples travelling along the ribbon
      const shimmer = 0.68
        + 0.32 * Math.sin(TAU * (u * 5.0 + 3 * p))
        * Math.sin(TAU * (u * 1.7 - 2 * p));
      const len = rb.len * GH * (0.75 + 0.25 * Math.sin(TAU * (u * 1.3 + p)));
      const a = rb.alpha * shimmer;
      if (a <= 0.01) continue;

      const grad = gctx.createLinearGradient(0, yc - len, 0, yc + len * 0.35);
      grad.addColorStop(0, `rgba(${cr},${cg},${cb},0)`);
      grad.addColorStop(0.55, `rgba(${cr},${cg},${cb},${(a * 0.55).toFixed(3)})`);
      grad.addColorStop(0.85, `rgba(${cr},${cg},${cb},${a.toFixed(3)})`);
      grad.addColorStop(1, `rgba(${cr},${cg},${cb},0)`);
      gctx.fillStyle = grad;
      gctx.fillRect(x, yc - len, step, len * 1.35);
    }
  }
  gctx.globalCompositeOperation = 'source-over';

  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = 'high';
  // draw twice, slightly offset, for a deeper glow
  ctx.globalAlpha = 0.85;
  ctx.drawImage(glow, 0, 0, RENDER_W, RENDER_H);
  ctx.globalAlpha = 0.35;
  ctx.drawImage(glow, -8, -10, RENDER_W + 16, RENDER_H + 20);
  ctx.globalAlpha = 0.18;
  ctx.drawImage(glow, -22, -26, RENDER_W + 44, RENDER_H + 52);
  ctx.restore();
}

function drawStars(t) {
  const p = t / LOOP;
  ctx.save();
  for (const s of stars) {
    const tw = s.base * (0.55 + 0.45 * Math.sin(TAU * (s.k * p + s.phase)));
    ctx.globalAlpha = tw;
    ctx.fillStyle = '#dfe9ff';
    ctx.beginPath();
    ctx.arc(s.x * RENDER_W, s.y * RENDER_H, s.r, 0, TAU);
    ctx.fill();
  }
  ctx.restore();
}

function drawRidge(ys, color) {
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(0, RENDER_H);
  const n = ys.length - 1;
  for (let i = 0; i <= n; i++) {
    const x = (i / n) * RENDER_W;
    const y = ys[i] * RENDER_H;
    if (i === 0) ctx.lineTo(x, y);
    else {
      const px = ((i - 1) / n) * RENDER_W;
      const py = ys[i - 1] * RENDER_H;
      ctx.quadraticCurveTo(px + (x - px) / 2, (py + y) / 2, x, y);
    }
  }
  ctx.lineTo(RENDER_W, RENDER_H);
  ctx.closePath();
  ctx.fill();
}

function drawMountains() {
  drawRidge(ridgeFar, '#0a0a1c');
  drawRidge(ridgeNear, '#050510');
}

// Faint reflected aurora light on the far ridge line.
function drawGroundGlow(t) {
  const p = t / LOOP;
  const a = 0.05 + 0.03 * Math.sin(TAU * p);
  const g = ctx.createLinearGradient(0, RENDER_H * 0.78, 0, RENDER_H);
  g.addColorStop(0, `rgba(64,255,190,${a.toFixed(3)})`);
  g.addColorStop(1, 'rgba(64,255,190,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, RENDER_H * 0.78, RENDER_W, RENDER_H * 0.22);
}

// Renders the complete frame for time t (seconds). Pure function of t.
function renderFrame(t) {
  drawSky();
  drawStars(t);
  drawAurora(t);
  drawGroundGlow(t);
  drawMountains();
}

// Exposed for the offline Playwright renderer.
window.renderFrame = renderFrame;
window.LOOP_SECONDS = LOOP;

// Live preview when opened in a browser.
if (!navigator.webdriver) {
  const start = performance.now();
  (function tick() {
    renderFrame(((performance.now() - start) / 1000) % LOOP);
    requestAnimationFrame(tick);
  })();
} else {
  renderFrame(0);
}
</script>
</body>
</html>
